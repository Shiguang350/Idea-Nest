<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4ecdc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>灵感收集</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --primary: #4ecdc4;
    --primary-dark: #3dbdb5;
    --primary-light: #e8faf8;
    --bg: #f7f9fc;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c9b;
    --text-light: #b0b8c4;
    --border: #eef1f5;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-hover: 0 6px 24px rgba(0,0,0,0.10);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
    --danger: #e74c5c;
    --danger-light: #fde8ea;
    --success: #2ecc71;
  }

  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100%;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header {
    padding: 24px 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo span { color: var(--primary); }

  nav { display: flex; gap: 4px; }

  .nav-link {
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 15px;
    font-weight: 500;
    padding: 8px 20px;
    border-radius: 20px;
    transition: all var(--transition);
  }

  .nav-link:hover { color: var(--text); background: var(--border); }
  .nav-link.active {
    color: #fff;
    background: var(--primary);
  }

  #content { flex: 1; padding: 28px 0; }

  .page-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .page-title .count {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-light);
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-light);
  }

  .empty-state .icon { font-size: 56px; margin-bottom: 16px; display: block; }
  .empty-state p { font-size: 15px; }

  .card-grid { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .card:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }

  .card .card-body { flex: 1; min-width: 0; }
  .card .card-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .card .card-excerpt {
    font-size: 14px;
    color: var(--text-secondary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .card .card-meta {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 6px;
  }

  .card-check {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    margin-top: 2px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition);
    background: #fff;
    font-size: 12px;
    color: transparent;
  }

  .card-check:hover { border-color: var(--primary); }

  .card-check.checked {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  .card.completed .card-title {
    text-decoration: line-through;
    color: var(--text-light);
  }

  .card.completed .card-excerpt {
    text-decoration: line-through;
  }

  .card.completed { opacity: 0.7; }

  .fab {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 28px;
    font-weight: 300;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(78, 205, 196, 0.35);
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    z-index: 100;
  }

  .fab:hover {
    background: var(--primary-dark);
    transform: scale(1.06);
    box-shadow: 0 6px 24px rgba(78, 205, 196, 0.45);
  }

  .fab:active { transform: scale(0.95); }

  .detail-page { max-width: 680px; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .btn-back {
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 24px;
    line-height: 1;
    transition: color var(--transition);
  }

  .btn-back:hover { color: var(--text); }

  .detail-title {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 12px;
    word-break: break-word;
  }

  .detail-meta {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .detail-content {
    font-size: 16px;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    margin-bottom: 32px;
  }

  .detail-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 24px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    text-decoration: none;
    line-height: 1.4;
  }

  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }

  .btn-outline {
    background: transparent;
    color: var(--text-secondary);
    border: 1.5px solid var(--border);
  }

  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  .btn-danger { background: var(--danger-light); color: var(--danger); }
  .btn-danger:hover { background: #fdd5d8; }

  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #27ae60; }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition);
  }

  .modal.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(3px);
  }

  .modal-dialog {
    position: relative;
    background: #fff;
    border-radius: 16px;
    padding: 28px;
    width: 90%;
    max-width: 520px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    animation: modalIn 0.2s ease;
  }

  .modal-sm { max-width: 380px; }

  @keyframes modalIn {
    from { transform: translateY(12px) scale(0.97); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-header h2 { font-size: 19px; font-weight: 600; }

  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-light);
    cursor: pointer;
    padding: 4px;
    line-height: 1;
    transition: color var(--transition);
  }

  .modal-close:hover { color: var(--text); }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text);
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-family: inherit;
    transition: border-color var(--transition);
    outline: none;
    background: var(--bg);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--primary);
    background: #fff;
  }

  .form-group textarea { min-height: 120px; resize: vertical; }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  .form-actions .btn { min-width: 80px; justify-content: center; }

  .confirm-text {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 24px;
    line-height: 1.6;
  }

  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

  @media (max-width: 600px) {
    #app { padding: 0 16px; }
    header { padding: 18px 0 16px; }
    .logo { font-size: 19px; }
    .nav-link { padding: 6px 14px; font-size: 14px; }
    .fab { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 24px; }
    .detail-title { font-size: 22px; }
    .detail-content { padding: 18px; }
    .modal-dialog { padding: 22px; }
    .card { padding: 14px 16px; }
    .card-delete-btn { opacity: 1; }
  }
  .fab-index { z-index: 100; }

  .card-delete-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-light);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    opacity: 0;
    margin-top: -2px;
  }

  .card:hover .card-delete-btn { opacity: 1; }
  .card-delete-btn:hover { background: var(--danger-light); color: var(--danger); }

  .trash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .trash-header .page-title { margin-bottom: 0; }

  .trash-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
  }

  .trash-tag.idea { background: var(--primary-light); color: var(--primary-dark); }
  .trash-tag.plan { background: #fef3e2; color: #d68910; }

  .card.trash-card { cursor: default; }
  .card.trash-card:hover { transform: none; box-shadow: var(--shadow); }
  .card.trash-card .card-body { cursor: default; }

  .trash-meta {
    font-size: 12px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .editor-page {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 110px);
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }

  .editor-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .editor-title-input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
    padding: 18px 4px 10px;
  }

  .editor-title-input::placeholder { color: var(--text-light); }

  .editor-content-input {
    width: 100%;
    flex: 1;
    min-height: 45vh;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 17px;
    line-height: 1.8;
    color: var(--text);
    padding: 6px 4px 16px;
    resize: vertical;
  }

  .editor-content-input::placeholder { color: var(--text-light); }

  .editor-images {
    padding: 14px 4px 8px;
    border-top: 1px solid var(--border);
  }

  .editor-image-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .image-preview-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }

  .image-thumb {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }

  .image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .remove-img {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .remove-img:hover { background: var(--danger); }

  .detail-images {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }

  .detail-images img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: var(--shadow);
    cursor: zoom-in;
    transition: transform var(--transition);
    display: block;
  }

  .detail-images img:hover { transform: scale(1.02); }

  .lightbox-img {
    max-width: 100%;
    max-height: 70vh;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }

  #modal .modal-dialog { max-width: 720px; }

  header { flex-wrap: wrap; row-gap: 10px; }
  body { overflow-x: hidden; }
  img { max-width: 100%; }

  @media (max-width: 640px) {
    #app { padding: 0 14px; }
    header { flex-direction: column; align-items: stretch; }
    .logo { text-align: center; }
    nav { justify-content: center; flex-wrap: wrap; gap: 6px; }
    .nav-link {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      padding: 8px 8px;
      font-size: 14px;
      white-space: nowrap;
    }
    #content { padding: 20px 0 96px; }
    .page-title { flex-wrap: wrap; }
    .card { padding: 14px; gap: 10px; }
    .card-excerpt {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .detail-title { font-size: 23px; }
    .detail-content { padding: 18px; }
    .detail-actions { gap: 10px; }
    .detail-actions .btn { flex: 1 1 auto; justify-content: center; padding: 11px 14px; }
    .trash-header { gap: 10px; }
    .trash-header .btn-danger { padding: 6px 12px; }
    .editor-page { min-height: calc(100vh - 90px); }
    .editor-page { min-height: calc(100dvh - 90px); }
    .editor-toolbar { gap: 8px; }
    .editor-toolbar .btn { padding: 8px 14px; }
    .editor-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .editor-title-input { font-size: 24px; }
    .editor-content-input { min-height: 42vh; font-size: 16px; }
    .image-thumb { width: 84px; height: 84px; }
    .detail-images { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .modal-dialog { padding: 20px; max-height: 88vh; }
    .fab { bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); right: 20px; width: 52px; height: 52px; }
    .card-delete-btn { opacity: 1; }
  }

  @media (max-width: 420px) {
    .nav-link { font-size: 13px; padding: 8px 4px; }
    .detail-actions { flex-direction: column; }
    .detail-actions .btn { width: 100%; }
    .trash-header { flex-direction: column; align-items: stretch; }
    .trash-header .btn-danger { align-self: flex-start; }
    .detail-images { grid-template-columns: 1fr; }
    .editor-toolbar { flex-wrap: wrap; }
    .editor-label { order: 3; width: 100%; text-align: center; white-space: normal; }
  }

  @media (hover: none) {
    .card-delete-btn { opacity: 1; }
  }

</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">✨ <span>灵感</span>收集</div>
    <nav>
      <a href="#ideas" class="nav-link active" data-page="ideas">💡 想法</a>
      <a href="#plans" class="nav-link" data-page="plans">📋 计划</a>
      <a href="#trash" class="nav-link" data-page="trash">🗑 回收站</a>
    </nav>
  </header>
  <main id="content"></main>
</div>

<div id="modal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 id="modal-title">新建</h2>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="confirm-modal" class="modal">
  <div class="modal-overlay"></div>
  <div class="modal-dialog modal-sm">
    <div class="modal-header">
      <h2 id="confirm-title">确认</h2>
      <button class="modal-close" id="confirm-close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div class="confirm-text" id="confirm-text"></div>
      <div class="confirm-actions" id="confirm-actions"></div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'inspiration_app_data';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        return {
          ideas: Array.isArray(data.ideas) ? data.ideas : [],
          plans: Array.isArray(data.plans) ? data.plans : [],
          trash: Array.isArray(data.trash) ? data.trash : [],
        };
     }
   } catch (e) { /* ignore */ }
    return { ideas: [], plans: [], trash: [] };
  }

  function saveData(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      alert('保存失败：存储空间不足，请减少图片数量或使用较小的图片');
      return false;
    }
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  let currentRoute = '';
  let pendingIdeaForPlan = null;
  let editIdeaId = null;
  let editPlanId = null;

  function navigate(hash) {
    if (!hash || hash === '#') hash = '#ideas';
    window.location.hash = hash;
  }

  function handleRoute() {
    const hash = window.location.hash || '#ideas';
    const matchIdeaEdit = hash.match(/^#idea\/([^/]+)\/edit$/);
    const matchPlanEdit = hash.match(/^#plan\/([^/]+)\/edit$/);
    const matchIdea = hash.match(/^#idea\/(.+)$/);
    const matchPlan = hash.match(/^#plan\/(.+)$/);

    let route;
    if (hash === '#idea/new') route = { page: 'idea-editor', id: null };
    else if (hash === '#plan/new') route = { page: 'plan-editor', id: null };
    else if (matchIdeaEdit) route = { page: 'idea-editor', id: matchIdeaEdit[1] };
    else if (matchPlanEdit) route = { page: 'plan-editor', id: matchPlanEdit[1] };
    else if (matchIdea) route = { page: 'idea-detail', id: matchIdea[1] };
    else if (matchPlan) route = { page: 'plan-detail', id: matchPlan[1] };
    else if (hash === '#plans') route = { page: 'plans' };
    else if (hash === '#trash') route = { page: 'trash' };
    else route = { page: 'ideas' };

    if (currentRoute === hash) return;
    currentRoute = hash;

    const activePage = route.page === 'idea-editor' ? 'ideas'
      : route.page === 'plan-editor' ? 'plans'
      : route.page;
    document.querySelectorAll('.nav-link').forEach(el => {
      el.classList.toggle('active', el.getAttribute('href') === `#${activePage}`);
    });

    render(route);
  }

  window.addEventListener('hashchange', handleRoute);

  function render(route) {
    const content = document.getElementById('content');
    switch (route.page) {
      case 'ideas': renderIdeasList(content); break;
      case 'idea-editor': renderIdeaEditor(content, route.id || null); break;
      case 'idea-detail': renderIdeaDetail(content, route.id); break;
      case 'plans': renderPlansList(content); break;
      case 'plan-editor': renderPlanEditor(content, route.id || null); break;
      case 'plan-detail': renderPlanDetail(content, route.id); break;
      case 'trash': renderTrashList(content); break;
      default: renderIdeasList(content);
    }
  }

  function renderIdeasList(container) {
    const data = loadData();
    const ideas = data.ideas.sort((a, b) => b.createdAt - a.createdAt);

  let editorImages = [];

  function renderImagePreview(type) {
    const el = document.getElementById(type + '-image-preview');
    if (!el) return;
    if (!editorImages.length) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML = editorImages.map((src, i) => `

  function triggerImagePicker(type) {
    document.getElementById(type + '-file-input')?.click();
  }

  async function handleImagesSelected(type) {
    const input = document.getElementById(type + '-file-input');
    const files = Array.from(input.files || []);
    input.value = '';
    if (!files.length) return;
    if (editorImages.length + files.length > 9) {
      alert('最多添加 9 张图片');
      return;
    }
    for (const file of files) {
      try {
        editorImages.push(await compressImage(file));
      } catch (e) {
        alert(`图片「${file.name}」读取失败`);
      }
    }
    renderImagePreview(type);
  }

  function removeEditorImage(index) {
    editorImages.splice(index, 1);
    renderImagePreview(editorType);
  }

  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => processImage(reader.result, file.type).then(resolve).catch(reject);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function compressDataUrl(dataUrl, mimeType) {
    return processImage(dataUrl, mimeType || 'image/jpeg');
  }

  function processImage(src, mimeType) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1280;
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > MAX || h > MAX) {
          const scale = Math.min(MAX / w, MAX / h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (mimeType !== 'image/png' && mimeType !== 'image/webp') {
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(img, 0, 0, w, h);
        let type = 'image/jpeg';
        if (mimeType === 'image/png' || mimeType === 'image/webp') type = mimeType;
        resolve(canvas.toDataURL(type, 0.82));
      };
      img.onerror = reject;
      img.src = src;
    });
  }

  async function generateAIImage() {
    const title = document.getElementById('idea-title').value.trim();
    const content = document.getElementById('idea-content').value.trim();
    if (!title && !content) {
      alert('请先填写想法标题或内容，再使用 AI 配图');
      return;
    }
    const btn = document.getElementById('ai-image-btn');
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = '生成中…';
    try {
      const res = await fetch('./api/generate-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content }),
      });
      const data = await res.json();
      if (!res.ok || !data.imageBase64) {
        throw new Error(data.error || '生成失败');
      }
      if (editorImages.length >= 9) {
        alert('最多添加 9 张图片');
        return;
      }
      const mimeType = data.mimeType || 'image/jpeg';
      const compressed = await compressDataUrl(`data:${mimeType};base64,${data.imageBase64}`, mimeType);
      editorImages.push(compressed);
      renderImagePreview(editorType);
    } catch (e) {
      alert('AI 配图失败：' + (e.message || '网络错误'));
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ AI 配图';
    }
  }

    container.innerHTML = html;
  }

  function restoreFromTrash(id, type) {
    const data = loadData();
    const idx = data.trash.findIndex(t => t.id === id);
    if (idx === -1) return;
    const item = data.trash.splice(idx, 1)[0];
    const { type: t, deletedAt, ...rest } = item;
    if (type === 'idea') {
      data.ideas.push(rest);
    } else {
      data.plans.push(rest);
    }
    saveData(data);
    navigate('#trash');
  }

  function permanentlyDelete(id) {
    const data = loadData();
    data.trash = data.trash.filter(t => t.id !== id);
    saveData(data);
    navigate('#trash');
  }

  function confirmEmptyTrash() {
    document.getElementById('confirm-title').textContent = '🗑 清空回收站';
    document.getElementById('confirm-text').textContent = '确定要永久清空回收站中的所有内容吗？此操作不可恢复。';
    document.getElementById('confirm-actions').innerHTML = `
      <button class="btn btn-outline" onclick="closeModal('confirm-modal')">取消</button>
      <button class="btn btn-danger" onclick="emptyTrash()">确认清空</button>
    `;
    openModal('confirm-modal');
  }

  function emptyTrash() {
    closeModal('confirm-modal');
    const data = loadData();
    data.trash = [];
    saveData(data);
    navigate('#trash');
  }

  handleRoute();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
